version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: genux-studio:latest
    container_name: genux-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    expose:
      - "3000"
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - NODE_ENV=production
      - JWT_SECRET=genux-admin-super-secure-key-2026
    volumes:
      - genux-data:/app/data
    networks:
      - default
      - coolify
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.genux-http.rule=Host(`genuxai.io`) || Host(`www.genuxai.io`) || Host(`docs.genuxai.io`)"
      - "traefik.http.routers.genux-http.entrypoints=http"
      - "traefik.http.routers.genux-http.middlewares=redirect-to-https@file"
      - "traefik.http.routers.genux-https.rule=Host(`genuxai.io`) || Host(`www.genuxai.io`) || Host(`docs.genuxai.io`)"
      - "traefik.http.routers.genux-https.entrypoints=https"
      - "traefik.http.routers.genux-https.tls=true"
      - "traefik.http.routers.genux-https.tls.certresolver=letsencrypt"
      - "traefik.http.services.genux-app.loadbalancer.server.port=3000"

volumes:
  genux-data:

networks:
  default:
  coolify:
    external: true
