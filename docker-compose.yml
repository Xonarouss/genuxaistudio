version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: genux-studio:latest
    container_name: genux-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    expose:
      - "3000"
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - NODE_ENV=production
      - JWT_SECRET=genux-admin-super-secure-key-2026
    volumes:
      - genux-data:/app/data

volumes:
  genux-data:
