name: Build & Publish Windows Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.0.9)'
        required: true
        default: '1.0.9'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            web-portal/package-lock.json
            desktop-app/package-lock.json

      # Cache electron binary download (~100MB, slow to re-download)
      - name: Cache Electron binary
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: electron-${{ runner.os }}-${{ hashFiles('desktop-app/package-lock.json') }}
          restore-keys: |
            electron-${{ runner.os }}-

      # ── Build web-portal ──────────────────────────────────────────────────────
      - name: Install web-portal dependencies
        run: npm ci
        working-directory: web-portal

      - name: Build web-portal production bundle
        run: npm run build
        working-directory: web-portal

      # ── Copy built UI into desktop-app/dist-ui ────────────────────────────────
      - name: Copy web-portal dist into desktop-app/dist-ui
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "desktop-app\dist-ui"
          Copy-Item -Recurse -Force "web-portal\dist\*" "desktop-app\dist-ui\"
          Write-Host "dist-ui: $(Get-ChildItem 'desktop-app\dist-ui' | Measure-Object | Select-Object -ExpandProperty Count) files"

      # ── Install desktop-app deps ──────────────────────────────────────────────
      - name: Install desktop-app dependencies
        run: npm ci
        working-directory: desktop-app
        env:
          # Increase timeout for electron binary download
          npm_config_fetch_timeout: 300000
          ELECTRON_GET_USE_PROXY: false

      # ── Verify electron was downloaded ────────────────────────────────────────
      - name: Verify Electron binary
        shell: pwsh
        run: |
          $electronPath = "desktop-app\node_modules\.bin\electron.cmd"
          if (Test-Path $electronPath) {
            Write-Host "Electron found at: $electronPath"
          } else {
            Write-Host "Electron bin not found, checking node_modules..."
            Get-ChildItem "desktop-app\node_modules\electron" -ErrorAction SilentlyContinue | Select-Object -First 5
          }
          # Show electron version
          node -e "console.log('Electron version:', require('./desktop-app/node_modules/electron/package.json').version)"

      # ── Set version ───────────────────────────────────────────────────────────
      - name: Resolve release version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $ver = "${{ github.ref_name }}" -replace "^v", ""
          } else {
            $ver = "${{ github.event.inputs.version }}"
          }
          echo "RELEASE_VERSION=$ver" >> $env:GITHUB_ENV
          Write-Host "Building v$ver"
          npm version $ver --no-git-tag-version --allow-same-version
        working-directory: desktop-app

      # ── Build NSIS installer ──────────────────────────────────────────────────
      - name: Build Electron NSIS installer
        shell: pwsh
        run: |
          # Use locally installed electron-builder (from node_modules)
          # NOT npx — avoids re-downloading and version mismatches
          .\node_modules\.bin\electron-builder.cmd --win nsis --publish never --x64
        working-directory: desktop-app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          WIN_CSC_LINK: ""
          WIN_CSC_KEY_PASSWORD: ""
          USE_HARD_LINKS: "false"

      # ── Find and verify installer ─────────────────────────────────────────────
      - name: Locate installer artifact
        shell: pwsh
        run: |
          Write-Host "dist-package contents:"
          Get-ChildItem "desktop-app\dist-package" | ForEach-Object {
            Write-Host "  $($_.Name) ($([math]::Round($_.Length/1MB, 1)) MB)"
          }
          $exe = Get-ChildItem "desktop-app\dist-package" -Filter "*.exe" `
                 | Where-Object { $_.Name -notmatch "uninstall" } `
                 | Sort-Object Length -Descending `
                 | Select-Object -First 1
          if (-not $exe) { Write-Error "No installer .exe found!"; exit 1 }
          Write-Host "Installer: $($exe.Name) ($([math]::Round($exe.Length/1MB,1)) MB)"
          echo "INSTALLER_PATH=$($exe.FullName)" >> $env:GITHUB_ENV
          echo "INSTALLER_NAME=$($exe.Name)" >> $env:GITHUB_ENV

      # ── Publish GitHub Release ────────────────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.RELEASE_VERSION }}
          name: "Genux AI Studio v${{ env.RELEASE_VERSION }}"
          draft: false
          prerelease: false
          body: |
            ## Genux AI Studio v${{ env.RELEASE_VERSION }}

            ### Quick Start
            1. Download **${{ env.INSTALLER_NAME }}** and run it
            2. Open the app → **Settings → Models** → download AI models
            3. Click **Install AI Engine Packages** (sets up Python + CUDA)
            4. Add photos to the **Vault** → reference with `@attachment1` in prompts
            5. Drop a video → hit **Recast** 🚀

            ### AI Pipeline
            | Stage | Model | Size |
            |---|---|---|
            | Character masking | SAM 2.1 Hiera-Large | 898 MB |
            | Skeleton tracking | DWPose 133-pt | 420 MB |
            | Prompt director | Gemma 2B Q4_K_M | 1.6 GB |
            | Video synthesis | **Wan 2.1 14B FP8** | 16.4 GB |
            | **Lip sync** *(optional)* | **LatentSync 1.5** | 1.7 GB |
            | Lip sync fallback | Wav2Lip GAN | 272 MB |
            | 60fps interpolation | RIFE | bundled |

            ### Requirements
            - Windows 10/11 64-bit
            - NVIDIA GPU 8GB+ VRAM (RTX 4080/5080 ideal)
            - Python 3.10+ from [python.org](https://python.org)
          files: ${{ env.INSTALLER_PATH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
