name: Build & Publish Windows Installer

on:
  push:
    tags:
      - 'v*'            # Triggers on any tag like v1.0.5, v2.0.0
  workflow_dispatch:    # Allow manual trigger from GitHub UI
    inputs:
      version:
        description: 'Version to release (e.g. 1.0.5)'
        required: true
        default: '1.0.5'

permissions:
  contents: write       # Required to create GitHub Releases

jobs:
  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest

    steps:
      # ── Checkout ────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Node.js setup ────────────────────────────────────────────────────────
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            web-portal/package-lock.json
            desktop-app/package-lock.json

      # ── Build web-portal UI (embeds into Electron app) ──────────────────────
      - name: Install web-portal dependencies
        run: npm ci
        working-directory: web-portal

      - name: Build web-portal production bundle
        run: npm run build
        working-directory: web-portal

      # ── Copy built UI into desktop-app/dist-ui ───────────────────────────────
      - name: Copy web-portal dist → desktop-app/dist-ui
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "desktop-app/dist-ui"
          Copy-Item -Recurse -Force "web-portal/dist/*" "desktop-app/dist-ui/"

      # ── Install desktop-app deps ──────────────────────────────────────────────
      - name: Install desktop-app dependencies
        run: npm ci
        working-directory: desktop-app

      # ── Resolve version ───────────────────────────────────────────────────────
      - name: Set version from tag or input
        shell: pwsh
        run: |
          $ver = if ("${{ github.ref_type }}" -eq "tag") {
            "${{ github.ref_name }}" -replace "^v", ""
          } else {
            "${{ github.event.inputs.version }}"
          }
          echo "RELEASE_VERSION=$ver" >> $env:GITHUB_ENV
          npm version $ver --no-git-tag-version
        working-directory: desktop-app

      # ── Build NSIS installer ──────────────────────────────────────────────────
      - name: Build Electron NSIS installer
        run: npx electron-builder --win nsis --publish never
        working-directory: desktop-app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Find installer artifact ───────────────────────────────────────────────
      - name: Find installer file
        id: find-installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem "desktop-app/dist-package" -Filter "Genux_AI_Setup_*.exe" | Select-Object -First 1
          echo "INSTALLER_PATH=$($installer.FullName)" >> $env:GITHUB_ENV
          echo "INSTALLER_NAME=$($installer.Name)" >> $env:GITHUB_ENV
          echo "Found: $($installer.FullName)"

      # ── Create GitHub Release ─────────────────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.RELEASE_VERSION }}
          name: "Genux AI Studio v${{ env.RELEASE_VERSION }}"
          draft: false
          prerelease: false
          body: |
            ## Genux AI Studio v${{ env.RELEASE_VERSION }}

            ### Installation
            1. Download **${{ env.INSTALLER_NAME }}** below
            2. Run the installer — it sets up everything automatically
            3. Open **Settings → Models** to download AI models (Wan 2.1, SAM 2.1, etc.)
            4. In Settings → Models → **Install AI Engine Packages** to set up PyTorch CUDA

            ### What's included
            - 🎬 Video recasting with multi-character swap
            - 🏎️ Background/scene/object replacement (cars, weather, trees, etc.)
            - 🤖 Wan 2.1 FP8 + SAM 2.1 + DWPose + RIFE 60fps pipeline
            - 🔧 Auto Python environment setup via Settings

            ### System Requirements
            - Windows 10/11 64-bit
            - NVIDIA GPU with 8GB+ VRAM (recommended: RTX 4080/5080 or better)
            - Python 3.10+ (for AI inference — download from [python.org](https://python.org))

            ---
            *Full source code: [github.com/Xonarouss/genuxaistudio](https://github.com/Xonarouss/genuxaistudio)*
          files: ${{ env.INSTALLER_PATH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
