name: Build & Publish Windows Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.0.7)'
        required: true
        default: '1.0.7'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ── Build web-portal ──────────────────────────────────────────────────────
      - name: Install web-portal dependencies
        run: npm ci
        working-directory: web-portal

      - name: Build web-portal production bundle
        run: npm run build
        working-directory: web-portal

      # ── Copy built UI into desktop-app/dist-ui ────────────────────────────────
      - name: Copy web-portal dist → desktop-app/dist-ui
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "desktop-app\dist-ui"
          Copy-Item -Recurse -Force "web-portal\dist\*" "desktop-app\dist-ui\"
          Write-Host "dist-ui contents:"
          Get-ChildItem "desktop-app\dist-ui" | ForEach-Object { Write-Host " $($_.Name)" }

      # ── Install desktop-app deps ──────────────────────────────────────────────
      - name: Install desktop-app dependencies
        run: npm ci
        working-directory: desktop-app

      # ── Set version ───────────────────────────────────────────────────────────
      - name: Resolve release version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $ver = "${{ github.ref_name }}" -replace "^v", ""
          } else {
            $ver = "${{ github.event.inputs.version }}"
          }
          Write-Host "Building version: $ver"
          echo "RELEASE_VERSION=$ver" >> $env:GITHUB_ENV
          npm version $ver --no-git-tag-version --allow-same-version
        working-directory: desktop-app

      # ── Ensure README.txt exists (required by installer.nsh) ─────────────────
      - name: Ensure required build assets exist
        shell: pwsh
        run: |
          # Create README.txt if missing (referenced by installer.nsh finish page)
          if (-not (Test-Path "desktop-app\README.txt")) {
            "Genux AI Studio - AI Video Recast Engine" | Out-File "desktop-app\README.txt" -Encoding utf8
            Write-Host "Created README.txt"
          }
          # Verify icon exists
          if (Test-Path "desktop-app\build\icon.ico") {
            Write-Host "icon.ico found OK"
          } else {
            Write-Host "WARNING: icon.ico missing"
          }
          # Verify installer.nsh exists
          if (Test-Path "desktop-app\build\installer.nsh") {
            Write-Host "installer.nsh found OK"
          } else {
            Write-Host "WARNING: installer.nsh missing"
          }

      # ── Build NSIS installer ──────────────────────────────────────────────────
      - name: Build Electron NSIS installer
        shell: pwsh
        run: |
          npx --yes electron-builder --win nsis --publish never --x64
        working-directory: desktop-app
        env:
          # NOTE: GH_TOKEN must NOT be set here — it causes electron-builder to
          # auto-detect GitHub publish config and try to push mid-build (fails).
          # Publishing is handled by the separate softprops/action-gh-release step.
          CSC_IDENTITY_AUTO_DISCOVERY: false
          WIN_CSC_LINK: ""
          WIN_CSC_KEY_PASSWORD: ""
          USE_HARD_LINKS: false
          DEBUG: "electron-builder"

      # ── Find installer ────────────────────────────────────────────────────────
      - name: Locate installer artifact
        shell: pwsh
        run: |
          Write-Host "Contents of dist-package:"
          Get-ChildItem "desktop-app\dist-package" -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host " $($_.Name)  ($([math]::Round($_.Length/1MB,1)) MB)"
          }
          $exe = Get-ChildItem "desktop-app\dist-package" -Filter "*.exe" |
                 Where-Object { $_.Name -notmatch "uninstall" } |
                 Select-Object -First 1
          if ($exe) {
            echo "INSTALLER_PATH=$($exe.FullName)" >> $env:GITHUB_ENV
            echo "INSTALLER_NAME=$($exe.Name)" >> $env:GITHUB_ENV
            Write-Host "Installer: $($exe.FullName)"
          } else {
            # If NSIS exe not found, try the dir output
            $dir = Get-ChildItem "desktop-app\dist-package" -Filter "win-unpacked" -Directory | Select-Object -First 1
            Write-Error "No installer .exe found. Dir output: $($dir?.FullName)"
            exit 1
          }

      # ── Create GitHub Release ─────────────────────────────────────────────────
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.RELEASE_VERSION }}
          name: "Genux AI Studio v${{ env.RELEASE_VERSION }}"
          draft: false
          prerelease: false
          body: |
            ## Genux AI Studio v${{ env.RELEASE_VERSION }}

            ### Install
            1. Download **${{ env.INSTALLER_NAME }}** below and run it
            2. Open the app → **Settings → Models** → download AI models
            3. **Settings → Models → Install AI Engine Packages** (Python CUDA setup)
            4. Add character photos to the **Vault** → use `@attachment1` in prompts
            5. Drop a video → hit **Recast** 🚀

            ### Pipeline stages (v${{ env.RELEASE_VERSION }})
            | Stage | Model | Size |
            |---|---|---|
            | Character masking | SAM 2.1 Hiera-Large | 898 MB |
            | Skeleton tracking | DWPose 133-pt | 420 MB |
            | Prompt director | Gemma 2B Q4_K_M | 1.6 GB |
            | Video synthesis | **Wan 2.1 14B FP8** | 16.4 GB |
            | **Lip sync** *(optional)* | **LatentSync 1.5** | 1.7 GB |
            | Lip sync fallback | Wav2Lip GAN | 272 MB |
            | Frame interpolation | RIFE 60fps | bundled |

            ### Requirements
            - Windows 10/11 64-bit
            - NVIDIA GPU 8GB+ VRAM (RTX 4080/5080 recommended)
            - Python 3.10+ from [python.org](https://python.org) (for AI engine)
          files: ${{ env.INSTALLER_PATH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
