<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%236366F1'/%3E%3Cstop offset='100%25' stop-color='%23A855F7'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='24' fill='%230B0D13'/%3E%3Cpolygon points='50,18 82,36 82,72 50,90 18,72 18,36' fill='none' stroke='url(%23g)' stroke-width='6'/%3E%3Ccircle cx='50' cy='54' r='14' fill='url(%23g)'/%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Genux AI Studio — 100% Local Video Recasting & Viral Studio (RTX 5080)</title>
    <!-- Google Fonts: Inter & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      @keyframes splashGlowPulse {
        0%, 100% { transform: scale(1); opacity: 0.55; }
        50% { transform: scale(1.15); opacity: 0.95; }
      }
      @keyframes splashBarAnim {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(250%); }
      }
      .splash-preloader {
        position: fixed;
        inset: 0;
        background: #07090E;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 99999;
        user-select: none;
      }
    </style>
  </head>
  <body class="bg-[#07090E] text-slate-100 overflow-hidden select-none">
    <div id="root">
      <div id="startup-splash-preloader" class="splash-preloader">
        <div style="position: relative; width: 110px; height: 110px; display: flex; align-items: center; justify-content: center;">
          <div style="position: absolute; inset: -15px; border-radius: 50%; background: radial-gradient(circle, rgba(99,102,241,0.35) 0%, rgba(168,85,247,0.15) 50%, transparent 75%); filter: blur(20px); animation: splashGlowPulse 2.2s ease-in-out infinite;"></div>
          <svg width="90" height="90" viewBox="0 0 100 100" fill="none" style="filter: drop-shadow(0 0 30px rgba(99,102,241,0.6));">
            <defs>
              <linearGradient id="genuxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#4F46E5" />
                <stop offset="50%" stop-color="#7C3AED" />
                <stop offset="100%" stop-color="#9333EA" />
              </linearGradient>
              <linearGradient id="genuxPrism" x1="20%" y1="10%" x2="80%" y2="90%">
                <stop offset="0%" stop-color="#06B6D4" />
                <stop offset="100%" stop-color="#4F46E5" />
              </linearGradient>
              <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                <feGaussianBlur stdDeviation="3" result="blur" />
                <feComposite in="SourceGraphic" in2="blur" operator="over" />
              </filter>
            </defs>
            <polygon points="50,6 88,27 88,73 50,94 12,73 12,27" stroke="#1E1B4B" stroke-width="3.5" stroke-linejoin="round" />
            <path d="M50 16 L76 31 L64 54 Z" fill="url(#genuxGrad)" opacity="0.9" />
            <path d="M80 37 L80 67 L56 61 Z" fill="url(#genuxGrad)" opacity="0.8" />
            <path d="M74 71 L48 86 L48 60 Z" fill="url(#genuxGrad)" opacity="0.9" />
            <path d="M44 84 L18 69 L30 46 Z" fill="url(#genuxGrad)" opacity="0.75" />
            <path d="M16 59 L16 29 L40 35 Z" fill="url(#genuxGrad)" opacity="0.85" />
            <path d="M22 25 L48 10 L48 36 Z" fill="url(#genuxGrad)" opacity="0.7" />
            <polygon points="42,38 66,50 42,62" fill="#FFFFFF" filter="url(#glow)" />
            <circle cx="50" cy="50" r="6" fill="url(#genuxPrism)" />
          </svg>
        </div>
        <h1 style="margin-top: 24px; font-size: 32px; font-weight: 800; letter-spacing: -0.5px; color: #FFFFFF; font-family: 'Inter', sans-serif; margin-bottom: 6px;">Genux AI</h1>
        <p style="font-size: 11px; font-weight: 600; color: #818cf8; letter-spacing: 2px; text-transform: uppercase; font-family: 'JetBrains Mono', monospace;">100% Local Video Recasting & Studio</p>
        <div style="width: 140px; height: 3px; background: rgba(255,255,255,0.08); border-radius: 99px; margin-top: 28px; overflow: hidden; position: relative;">
          <div style="position: absolute; top: 0; bottom: 0; width: 50%; background: linear-gradient(90deg, #6366F1, #A855F7); border-radius: 99px; animation: splashBarAnim 1.6s ease-in-out infinite;"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/desktop-main.tsx"></script>
  </body>
</html>
